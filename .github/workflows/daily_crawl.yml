name: CMC Daily Crawler

on:
  schedule:
    # 7:00 AM Vietnam (UTC+7) = 00:00 UTC
    - cron: "0 0 * * *"

  # Cho phép chạy thủ công từ GitHub UI
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout repo ─────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Setup Python ───────────────────────────────────────
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      # ── 3. Install dependencies ───────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Create logs dir ────────────────────────────────────
      - name: Prepare directories
        run: mkdir -p data logs

      # ── 5. Run crawler ────────────────────────────────────────
      - name: Run CMC Crawler
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SPREADSHEET_ID:   ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: python script/crawl_cmc.py

      # ── 6. Commit & push CSV data back to repo ────────────────
      - name: Commit data files
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git add logs/
          git diff --staged --quiet || git commit -m "📊 Daily snapshot $(date -u '+%Y-%m-%d') [auto]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
